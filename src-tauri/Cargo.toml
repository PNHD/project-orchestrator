[package]
name = "project-orchestrator"
version = "0.3.0"
description = "Local-first mission control for stateful AI coding agents"
authors = ["Project Orchestrator"]
edition = "2021"
default-run = "project-orchestrator"

[lib]
name = "project_orchestrator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8.0", features = [] }
thiserror = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
